name: 'Publish Release'

on:
  push:
    tags:
     - v*
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
            name: 'Windows-x64'
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
            name: 'Windows-ARM64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
            name: 'Linux-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'npm'

      - name: install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: validate release version
        id: version
        run: node scripts/version.mjs --check --github-output

      - name: validate frontend
        run: |
          npm test
          npm run build

      - name: validate database safety
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'Nova versão do Revisum disponível!'
          releaseDraft: true # Cria como rascunho para você revisar antes de publicar
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
